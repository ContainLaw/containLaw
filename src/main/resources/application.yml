spring:
  application:
    name: containLaw

  docker:
    compose:
      enabled: true
      file: docker-compose.yml
      lifecycle-management: start_only

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/containlaw
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect

  # 템플릿 캐시 비활성화
  thymeleaf:
    cache: false

openai:
  api:
    key: ${CHATGPT_API_KEY:secret-api-key}

external:
  api:
    gov-lm-key: ${GOV_LM_API_KEY:}
    lsm-lm-key: ${LSM_LM_API_KEY:}
